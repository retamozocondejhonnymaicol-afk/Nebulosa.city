<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebulosa.city</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0c1120;
    --panel:#1b2334ee;
    --panel-edge:#2f3d55;
    --gold:#c9a961;
    --gold-bright:#e8c777;
    --parchment:#e8dcc4;
    --parchment-dim:#a8a190;
    --moss-bright:#79c48f;
    --danger:#d97757;
    --shadow:rgba(0,0,0,0.55);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg-deep); font-family:'Work Sans', sans-serif; }
  canvas{ display:block; position:fixed; inset:0; touch-action:none; }

  .hud{ position:fixed; inset:0; pointer-events:none; }
  .mass-panel{
    position:fixed; top:18px; left:18px;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:8px 16px; color:var(--gold-bright); font-family:'Cinzel', serif; font-size:15px;
  }
  .leaderboard{
    position:fixed; top:18px; right:18px; width:170px;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:10px 12px; color:var(--parchment);
  }
  .leaderboard h3{ margin:0 0 6px; font-family:'Cinzel', serif; font-size:13px; color:var(--gold-bright); font-weight:600; }
  .leaderboard ol{ margin:0; padding-left:18px; font-size:12.5px; line-height:1.6; }
  .leaderboard li.me{ color:var(--moss-bright); }

  .hint{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:20px;
    padding:8px 18px; color:var(--parchment-dim); font-size:13px; transition:opacity 0.6s ease;
  }

  .minimap-wrap{
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:6px;
  }
  #minimap{ display:block; border-radius:6px; }

  .boost-btn{
    position:fixed; right:26px; bottom:26px;
    width:82px; height:82px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8c777, #b8873f);
    border:2px solid var(--gold);
    box-shadow:0 12px 26px var(--shadow);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:2px;
    color:#241c08; font-family:'Cinzel', serif; font-weight:700; font-size:12px;
    pointer-events:auto; cursor:pointer; user-select:none;
  }
  .boost-btn:active{ transform:scale(0.94); }
  .boost-btn svg{ width:26px; height:26px; }

  /* Joystick táctil, colocado al costado del impulso */
  .joystick{
    position:fixed; right:118px; bottom:26px;
    width:108px; height:108px; border-radius:50%;
    background:radial-gradient(circle, rgba(47,61,85,.92), rgba(18,25,40,.92));
    border:2px solid rgba(201,169,97,.75);
    box-shadow:0 12px 26px var(--shadow), inset 0 0 20px rgba(0,0,0,.35);
    pointer-events:auto; touch-action:none; user-select:none;
    display:none; align-items:center; justify-content:center;
  }
  .joystick::after{
    content:''; position:absolute; inset:12px; border-radius:50%;
    border:1px solid rgba(232,199,119,.28);
  }
  .joystick-knob{
    position:absolute; left:50%; top:50%;
    width:48px; height:48px; margin:-24px 0 0 -24px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8c777, #9e7437);
    border:2px solid var(--gold);
    box-shadow:0 7px 16px rgba(0,0,0,.45);
    transform:translate(0,0);
    transition:transform .04s linear;
  }
  .joystick-label{
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center; color:rgba(232,220,196,.72);
    font:600 9px 'Work Sans',sans-serif; letter-spacing:.5px;
    pointer-events:none;
  }
  @media (max-width:700px){
    .boost-btn{ right:18px; bottom:20px; width:76px; height:76px; }
    .joystick{ right:106px; bottom:16px; width:94px; height:94px; }
    .joystick-knob{ width:42px; height:42px; margin:-21px 0 0 -21px; }
  }

  .overlay{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #1c2438 0%, #0c1120 70%);
    text-align:center; padding:24px;
  }
  .overlay.hidden{ display:none; }
  .overlay h1{ font-family:'Cinzel', serif; font-size:clamp(28px,5vw,44px); color:var(--parchment); margin:0 0 8px; }
  .overlay p.sub{ color:var(--parchment-dim); font-size:15px; max-width:420px; margin:0 0 30px; }
  .overlay p.result{ color:var(--gold-bright); font-size:18px; margin:0 0 26px; font-family:'Cinzel', serif; }

  .skin-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:30px; max-width:520px; }
  .skin-option{
    width:76px; height:76px; border-radius:50%; border:3px solid transparent; cursor:pointer;
    overflow:hidden; background:var(--panel); position:relative; transition:border-color 0.2s ease, transform 0.2s ease;
  }
  .skin-option img{ width:100%; height:100%; object-fit:cover; }
  .skin-option.selected{ border-color:var(--moss-bright); transform:scale(1.08); }
  .skin-option span{
    position:absolute; bottom:0; left:0; right:0; font-size:10px; color:var(--parchment);
    background:rgba(0,0,0,0.55); padding:2px 0;
  }

  .play-btn{
    font-family:'Cinzel', serif; font-weight:600; font-size:16px; color:#12180f;
    background:var(--moss-bright); border:none; border-radius:26px; padding:14px 44px; cursor:pointer;
    box-shadow:0 12px 26px var(--shadow);
  }
  .play-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .secondary-btn{
    margin-top:14px; font-family:'Work Sans', sans-serif; font-size:13.5px; color:var(--gold-bright);
    background:transparent; border:1px solid var(--gold); border-radius:8px; padding:8px 18px; cursor:pointer;
  }

  .exit-btn{
    position:fixed; top:78px; left:18px; z-index:30;
    width:54px; height:30px; padding:0;
    border:1px solid rgba(201,169,97,.75);
    border-radius:7px;
    background:rgba(27,35,52,.92);
    color:var(--parchment);
    font:600 11px 'Work Sans',sans-serif;
    cursor:pointer; pointer-events:auto;
    box-shadow:0 5px 14px rgba(0,0,0,.35);
  }
  .exit-btn:active{transform:scale(.94)}
  @media(max-width:700px){
    .exit-btn{top:12px;left:12px;width:48px;height:28px;font-size:10px}
  }

</style>
</head>
<body>

<canvas id="game"></canvas>


  <button class="exit-btn" id="exitBtn" style="display:none;">Salir</button>

<div class="hud">
  <div class="mass-panel" id="massPanel" style="display:none;">Masa: 0</div>
  <div class="leaderboard" id="leaderboard" style="display:none;">
    <h3>Top del enjambre</h3>
    <ol id="leaderboardList"></ol>
  </div>
  <div class="minimap-wrap" id="minimapWrap" style="display:none;">
    <canvas id="minimap" width="130" height="130"></canvas>
  </div>
  <p class="hint" id="hint" style="display:none;">Mueve el mouse o el dedo para dirigirte · absorbe puntos y rivales más pequeños</p>
  <div class="boost-btn" id="boostBtn" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#241c08" stroke-width="2"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>
    Impulso
  </div>
  <div class="joystick" id="joystick" aria-label="Joystick de movimiento">
    <div class="joystick-knob" id="joystickKnob"></div>
    <div class="joystick-label">MOVER</div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <h1>Nebulosa.city</h1>
  <p class="sub">| Elige bien tu personaje mrd |<br>| no seas puto |</p>
  <div class="skin-row" id="skinRow"></div>
  <button class="play-btn" id="playBtn" disabled>Jugar</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <h1>| ALparecer te violaron por gil |</h1>
  <p class="result" id="finalMass">masa final: 0</p>
  <button class="play-btn" id="retryBtn">Jugar de nuevo</button>
  <button class="secondary-btn" id="changeSkinBtn">Elegir otro personaje </button>
</div>

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const skinRow = document.getElementById('skinRow');
  const playBtn = document.getElementById('playBtn');
  const retryBtn = document.getElementById('retryBtn');
  const changeSkinBtn = document.getElementById('changeSkinBtn');
  const massPanel = document.getElementById('massPanel');

  const leaderboardList = document.getElementById('leaderboardList');
  const hint = document.getElementById('hint');

  const minimap = document.getElementById('minimap');
  const mctx = minimap.getContext('2d');

  const joystick = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');

  let boostTimer = 0, boostDirX = 0, boostDirY = 1;
  let joystickActive = false, joystickX = 0, joystickY = 0, lastJoystickSound = 0;
  const BOOST_COST = 9, BOOST_MIN_MASS = 30, BOOST_DURATION = 0.28, BOOST_SPEED_MULT = 2.4;

  // ---------- sound ----------
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    else if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freqStart, freqEnd, duration, type, volume){
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  function sfxEat(){
    if (!audioCtx) return;
    beep(430, 760, 0.07, 'sine', 0.075);
    setTimeout(()=>beep(760, 980, 0.045, 'sine', 0.045), 28);
  }
  function sfxAbsorb(){
    if (!audioCtx) return;
    beep(180, 62, 0.32, 'sawtooth', 0.11);
    setTimeout(()=>beep(520, 180, 0.18, 'triangle', 0.07), 35);
  }
  function sfxBoost(){
    if (!audioCtx) return;
    beep(150, 720, 0.18, 'sawtooth', 0.09);
    setTimeout(()=>beep(720, 1150, 0.10, 'square', 0.045), 35);
  }
  function sfxGameOver(){
    if (!audioCtx) return;
    beep(420, 180, 0.22, 'sine', 0.10);
    setTimeout(()=>beep(250, 75, 0.65, 'triangle', 0.13), 170);
  }
  function sfxStart(){
    if (!audioCtx) return;
    beep(260, 520, 0.10, 'sine', 0.06);
    setTimeout(()=>beep(520, 880, 0.12, 'sine', 0.07), 80);
  }
  function sfxClick(){
    if (!audioCtx) return;
    beep(600, 760, 0.055, 'square', 0.045);
  }

  function tryBoost(){
    ensureAudio();
    if (!running || player.mass < BOOST_MIN_MASS || boostTimer > 0) return;
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    const dx = joystickActive && Math.hypot(joystickX,joystickY) > .12
      ? joystickX : (pointerX ?? cx) - cx;
    const dy = joystickActive && Math.hypot(joystickX,joystickY) > .12
      ? joystickY : (pointerY ?? cy) - cy;
    const len = Math.hypot(dx,dy) || 1;
    boostDirX = dx/len; boostDirY = dy/len;
    player.mass -= BOOST_COST;
    boostTimer = BOOST_DURATION;
    sfxBoost();
  }
  boostBtn.addEventListener('pointerdown', e => { e.stopPropagation(); tryBoost(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); tryBoost(); } });

  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function loadImage(src){
    return new Promise(resolve => { const img = new Image(); img.onload = () => resolve(img); img.src = src; });
  }

  function circularCanvas(img, size){
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const cx = c.getContext('2d');
    const r = size/2;
    cx.save();
    cx.beginPath(); cx.arc(r,r,r,0,Math.PI*2); cx.closePath(); cx.clip();
    const scale = Math.max(size/img.width, size/img.height);
    const w = img.width*scale, h = img.height*scale;
    cx.drawImage(img, r-w/2, r-h/2, w, h);
    cx.restore();
    return c;
  }

  const FOOD_COUNT = 420;
  const BOT_COUNT = 5;

  let player, bots = [], food = [];
  let running = false;
  let pointerX = null, pointerY = null;

  window.addEventListener('pointermove', e => {
    if (!joystickActive) { pointerX = e.clientX; pointerY = e.clientY; }
  });
  window.addEventListener('pointerdown', e => {
    if (!joystickActive && e.target !== joystick && !joystick.contains(e.target)) {
      pointerX = e.clientX; pointerY = e.clientY;
    }
  });

  function updateJoystick(e){
    const r = joystick.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const max = r.width * 0.31;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx,dy);
    if (len > max) { dx = dx/len*max; dy = dy/len*max; }
    joystickX = dx/max;
    joystickY = dy/max;
    joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;
    const now = performance.now();
    if (Math.hypot(joystickX,joystickY) > .15 && now-lastJoystickSound > 280) {
      sfxClick();
      lastJoystickSound = now;
    }
  }
  function resetJoystick(){
    joystickActive = false;
    joystickX = joystickY = 0;
    joystickKnob.style.transform = 'translate(0,0)';
  }
  joystick.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    ensureAudio();
    joystickActive = true;
    joystick.setPointerCapture?.(e.pointerId);
    updateJoystick(e);
  });
  joystick.addEventListener('pointermove', e => {
    if (joystickActive) { e.preventDefault(); updateJoystick(e); }
  });
  joystick.addEventListener('pointerup', resetJoystick);
  joystick.addEventListener('pointercancel', resetJoystick);
  joystick.addEventListener('lostpointercapture', resetJoystick);

  function randRange(a,b){ return a + Math.random()*(b-a); }

  function makeBlob(charIndex, x, y, mass){
    return {
      char: charIndex,
      name: CHARACTERS[charIndex].name,
      portrait: portraits[charIndex],
      ring: CHARACTERS[charIndex].ring,
      x, y, mass,
      dirAngle: Math.random()*Math.PI*2,
      dirTimer: 0,
    };
  }

  function radiusOf(mass){ return 16 + Math.sqrt(mass)*2.1; }
  function speedOf(mass){ return 230 / (1 + mass*0.012); }

  function spawnFood(){
    food = [];
    for (let i=0;i<FOOD_COUNT;i++){
      food.push({
        x: randRange(40, WORLD-40),
        y: randRange(40, WORLD-40),
        hue: Math.floor(randRange(0,360)),
        r: randRange(3.5,5.5)
      });
    }
  }

  function respawnFoodAt(f){
    f.x = randRange(40, WORLD-40);
    f.y = randRange(40, WORLD-40);
    f.hue = Math.floor(randRange(0,360));
  }

  function startGame(){
  if (exitBtn) exitBtn.style.display = 'block';
    const remaining = CHARACTERS.map((c,i)=>i).filter(i => i !== selectedSkin);
    player = makeBlob(selectedSkin, WORLD/2, WORLD/2, 40);
    bots = remaining.map(i => makeBlob(i, randRange(200,WORLD-200), randRange(200,WORLD-200), randRange(25,70)));
    spawnFood();
    running = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    massPanel.style.display = 'block';
    leaderboardEl.style.display = 'block';
    minimapWrap.style.display = 'block';
    boostBtn.style.display = 'flex';
    joystick.style.display = 'flex';
    boostTimer = 0;
    hint.style.display = 'block';
    hint.style.opacity = '1';
    setTimeout(()=>{ hint.style.opacity = '0'; }, 6000);
    pointerX = window.innerWidth/2; pointerY = window.innerHeight/2;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    sfxGameOver();
    finalMassEl.textContent = `Masa final: ${Math.floor(player.mass)}`;
    gameOverScreen.classList.remove('hidden');
    massPanel.style.display = 'none';
    leaderboardEl.style.display = 'none';
    minimapWrap.style.display = 'none';
    boostBtn.style.display = 'none';
    joystick.style.display = 'none';
    resetJoystick();
    hint.style.display = 'none';
  }

  function respawnBot(bot){
    bot.x = randRange(200, WORLD-200);
    bot.y = randRange(200, WORLD-200);
    bot.mass = randRange(25,70);
  }

  let lastTime = performance.now();
  function loop(now){
    if (!running) return;
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function moveBlobToward(blob, dx, dy, dt, speedMult){
    const len = Math.hypot(dx,dy) || 1;
    const spd = speedOf(blob.mass) * (speedMult || 1);
    blob.x += dx/len*spd*dt;
    blob.y += dy/len*spd*dt;
    blob.x = Math.max(0, Math.min(WORLD, blob.x));
    blob.y = Math.max(0, Math.min(WORLD, blob.y));
  }

  function update(dt){
  // Mantener abundante comida para que el jugador pueda crecer mucho.
  while (food.length < FOOD_COUNT) spawnFood();
    if (boostTimer > 0){
      boostTimer -= dt;
      moveBlobToward(player, boostDirX, boostDirY, dt, BOOST_SPEED_MULT);
    } else {
      // player movement toward pointer (screen-space vector, player always centered)
      const cx = window.innerWidth/2, cy = window.innerHeight/2;
      const dx = joystickActive && Math.hypot(joystickX,joystickY) > 0.08
        ? joystickX : (pointerX ?? cx) - cx;
      const dy = joystickActive && Math.hypot(joystickX,joystickY) > 0.08
        ? joystickY : (pointerY ?? cy) - cy;
      if (joystickActive) {
        if (Math.hypot(dx,dy) > 0.08) moveBlobToward(player, dx, dy, dt);
      } else if (Math.hypot(dx,dy) > 8) {
        moveBlobToward(player, dx, dy, dt);
      }
    }

    // bots wander
    bots.forEach(b => {
      b.dirTimer -= dt;
      if (b.dirTimer <= 0){ b.dirAngle += randRange(-1.4,1.4); b.dirTimer = randRange(1,2.4); }
      moveBlobToward(b, Math.cos(b.dirAngle), Math.sin(b.dirAngle), dt);
    });

    const all = [player, ...bots];

    // eat food
    let playerAte = false;
    all.forEach(blob => {
      const r = radiusOf(blob.mass);
      food.forEach(f => {
        const d = Math.hypot(f.x-blob.x, f.y-blob.y);
        if (d < r) { blob.mass += 0.9; respawnFoodAt(f); if (blob === player) playerAte = true; }
      });
    });
    if (playerAte) sfxEat();

    // blob vs blob
    for (let i=0;i<all.length;i++){
      for (let j=i+1;j<all.length;j++){
        const a = all[i], b = all[j];
        if (!a || !b || a.mass<=0 || b.mass<=0) continue;
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        const ra = radiusOf(a.mass), rb = radiusOf(b.mass);
        if (d < Math.max(ra,rb)*0.72){
          if (a.mass > b.mass*1.15){ a.mass += b.mass*0.8; eliminate(b); if (a === player) sfxAbsorb(); }
          else if (b.mass > a.mass*1.15){ b.mass += a.mass*0.8; eliminate(a); if (b === player) sfxAbsorb(); }
        }
      }
    }
  }

  function eliminate(blob){
    if (blob === player){ endGame(); return; }
    respawnBot(blob);
  }

  function draw(){
    ctx.fillStyle = '#0c1120';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const zoom = Math.max(0.45, Math.min(1.05, 1.15 - player.mass/1400));
    const camX = player.x, camY = player.y;
    const w2 = canvas.width/2, h2 = canvas.height/2;
    function toScreen(x,y){ return [ (x-camX)*zoom + w2, (y-camY)*zoom + h2 ]; }

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const gridSize = 120*zoom;
    const offX = ((-camX*zoom) % gridSize + gridSize) % gridSize;
    const offY = ((-camY*zoom) % gridSize + gridSize) % gridSize;
    for (let x=offX; x<canvas.width; x+=gridSize){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for (let y=offY; y<canvas.height; y+=gridSize){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

    // world border
    const [bx1,by1] = toScreen(0,0);
    const [bx2,by2] = toScreen(WORLD,WORLD);
    ctx.strokeStyle = 'rgba(201,169,97,0.4)';
    ctx.lineWidth = 3;
    ctx.strokeRect(bx1,by1,bx2-bx1,by2-by1);

    // food
    food.forEach(f => {
      const [sx,sy] = toScreen(f.x,f.y);
      if (sx<-20||sx>canvas.width+20||sy<-20||sy>canvas.height+20) return;
      ctx.beginPath();
      ctx.fillStyle = `hsl(${f.hue}, 70%, 65%)`;
      ctx.arc(sx, sy, f.r*zoom, 0, Math.PI*2);
      ctx.fill();
    });

    // blobs sorted by mass ascending (draw big ones on top)
    const all = [player, ...bots].slice().sort((a,b)=>a.mass-b.mass);
    all.forEach(blob => {
      const [sx,sy] = toScreen(blob.x, blob.y);
      const r = radiusOf(blob.mass)*zoom;
      ctx.save();
      ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.closePath(); ctx.clip();
      ctx.drawImage(blob.portrait, sx-r, sy-r, r*2, r*2);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(sx,sy,r,0,Math.PI*2);
      ctx.lineWidth = Math.max(2, r*0.08);
      ctx.strokeStyle = blob === player ? '#e8c777' : blob.ring;
      ctx.stroke();
      ctx.font = `600 ${Math.max(11, r*0.24)}px 'Work Sans', sans-serif`;
      ctx.fillStyle = 'rgba(232,220,196,0.95)';
      ctx.textAlign = 'center';
      ctx.fillText(blob.name, sx, sy + r + 14);
    });

    massPanel.textContent = `Masa: ${Math.floor(player.mass)}`;
    const ranked = all.slice().sort((a,b)=>b.mass-a.mass).slice(0,5);
    leaderboardList.innerHTML = ranked.map(b => `<li class="${b===player?'me':''}">${b.name} — ${Math.floor(b.mass)}</li>`).join('');

    drawMinimap(all);
  }

  function drawMinimap(all){
    mctx.clearRect(0,0,130,130);
    mctx.fillStyle = 'rgba(12,17,32,0.9)';
    mctx.fillRect(0,0,130,130);
    mctx.strokeStyle = 'rgba(201,169,97,0.5)';
    mctx.strokeRect(1,1,128,128);
    all.forEach(b => {
      const mx = (b.x/WORLD)*130, my = (b.y/WORLD)*130;
      mctx.beginPath();
      mctx.fillStyle = b === player ? '#79c48f' : b.ring;
      mctx.arc(mx, my, b === player ? 4 : 2.6, 0, Math.PI*2);
      mctx.fill();
    });
  }

  // ---------- start screen ----------
  Promise.all(CHARACTERS.map(c => loadImage(c.img))).then(imgs => {
    portraits = imgs.map(img => circularCanvas(img, 200));
    CHARACTERS.forEach((c,i) => {
      const opt = document.createElement('div');
      opt.className = 'skin-option';
      opt.innerHTML = `<img src="${portraits[i].toDataURL()}"><span>${c.name}</span>`;
      opt.addEventListener('click', () => {
        document.querySelectorAll('.skin-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedSkin = i;
        playBtn.disabled = false;
      });
      skinRow.appendChild(opt);
    });
  });

  playBtn.addEventListener('click', () => {
    if (selectedSkin !== null) { ensureAudio(); sfxStart(); startGame(); }
  });
  retryBtn.addEventListener('click', () => {
    if (selectedSkin !== null) { ensureAudio(); sfxStart(); startGame(); }
  });
  changeSkinBtn.addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  });

  const exitBtn = document.getElementById('exitBtn');
  if (exitBtn){
    exitBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      if (typeof endGame === 'function') endGame();
      else {
        running = false;
        document.getElementById('startScreen')?.classList.remove('hidden');
        document.getElementById('gameOverScreen')?.classList.add('hidden');
      }
      exitBtn.style.display = 'none';
    });
  }

})();
</script>
</body>
</html>
